[project]
name = "patient-sim-voice-qa"
version = "0.1.0"
description = "Voice bot that plays a patient on outbound calls to test a clinic's AI phone agent"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,anthropic,cartesia,silero]~=1.8.7",
    "livekit-plugins-noise-cancellation~=0.3.2",
    "livekit-api~=1.2",
    "python-dotenv>=1.0",
    "certifi",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
