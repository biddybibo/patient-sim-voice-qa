id: after-hours-holiday
category: time-date
persona: skeptical
caller: B
goal: >-
  Book a visit for 7 PM any weekday next week because of your work schedule. If that's impossible,
  ask for Thanksgiving Day, Thursday November 26th, in the morning, since you're off work then.
probes:
  - Ask what time they close on weekdays.
expected:
  - Declines 7 PM with the real closing time
  - Recognizes Thanksgiving as a likely closure or checks before booking
max_minutes: 4
