# How the caller talks and sounds. A scenario picks one; the voice is chosen by the
# caller's gender (from facts.yaml). Speed is Cartesia sonic-3 speed (0.6-2.0, 1.0 normal);
# emotion is a Cartesia emotion hint.

neutral:
  goodbye: "Oh, sorry, I have to hop off, I'll call back later. Thanks, bye!"
  style: >-
    Friendly and ordinary. Polite, a little casual, says "um" now and then.
  speed: 1.0
  emotion: Calm
  voices:
    female: e8e5fffb-252c-436d-b842-8879b84445b6  # Cathy - Coworker
    male: 87bc56aa-ab01-4baa-9071-77d497064686    # Jordan - Chill Pal

rushed_professional:
  goodbye: "Sorry, I'm getting pulled into a meeting, I'll call back. Thanks, bye."
  style: >-
    Calling between meetings. Short, direct sentences, wants it done fast, gets a little
    impatient with long explanations or repeated questions, but stays polite.
  speed: 1.15
  emotion: Determined
  voices:
    female: 5abd2130-146a-41b1-bcdb-974ea8e19f56  # Jo - Go to Gal
    male: 87286a8d-7ea7-4235-a41a-dd9fa6630feb    # Henry - Plainspoken Guy

hesitant_elderly:
  goodbye: "Oh dear, I have to go now, I'll call back another time. Thank you, goodbye."
  style: >-
    Older caller, not great with phone systems. Speaks slowly, says "oh" and "let me see",
    sometimes asks them to repeat something, occasionally loses track and needs a moment.
  speed: 0.85
  emotion: Hesitant
  voices:
    female: ae823354-f9be-4aef-8543-f569644136b4  # Mariana - Nurturing Guide
    male: c99d36f3-5ffd-4253-803a-535c1bc9c306    # Griffin - Narrator (elderly)

chatty_oversharer:
  goodbye: "Oh shoot, my other line's ringing, I'll call you back later. Thanks so much, bye now!"
  style: >-
    Warm and talkative. Adds small personal details and tangents, but comes back to what
    you need. Still keeps each turn to two or three sentences.
  speed: 1.05
  emotion: Happy
  voices:
    female: 78ab82d5-25be-4f7d-82b3-7ad64e5b85b2  # Savannah - Magnolia Belle
    male: 146485fd-8736-41c7-88a8-7cdd0da34d84    # Tim - Pal

skeptical:
  goodbye: "I've got to go. I'll call back when I have more time. Bye."
  style: >-
    A bit wary and blunt. Double-checks what you're told ("wait, you're sure?"), notices
    contradictions and calls them out, asks for specifics instead of vague answers.
  speed: 1.0
  emotion: Skeptical
  voices:
    female: a7b8d8fa-f6e5-4908-900e-0c11d1d82519  # Joanie - Vibrant Speaker
    male: 5ee9feff-1265-424a-9d7f-8e4d431a12c7    # Ronald - Thinker

non_native:
  goodbye: "Sorry, I must go now. I will call again later. Thank you, goodbye."
  style: >-
    English is your second language. Simple sentence structure, occasionally searches for a
    word or uses a slightly wrong one, asks them to slow down or repeat if they talk fast.
  speed: 0.92
  emotion: Neutral
  voices:
    female: 07bc462a-c644-49f1-baf7-82d5599131be  # Sindhu - Conversational Partner
    male: 1fc31370-81b1-4588-9c1a-f93793c6e01d    # Carlo - Roman Guide

anxious_parent:
  goodbye: "Oh, sorry, I have to go, I'll call back. Thank you, bye."
  style: >-
    Worried and a little scattered, talks slightly fast, asks "is that normal?" type
    questions, needs reassurance before moving on.
  speed: 1.1
  emotion: Anxious
  voices:
    female: 57dcab65-68ac-45a6-8480-6c4c52ec1cd1  # Kira - Trusted Confidant
    male: 0ad65e7f-006c-47cf-bd31-52279d487913    # Rupert - Caring Dad
